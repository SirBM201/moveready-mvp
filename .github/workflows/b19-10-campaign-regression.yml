name: B19.10 Job Search Campaign Regression Gate
on:
  pull_request:
    paths:
      - 'app/services/job_search_campaign*.py'
      - 'app/routes/job_search_campaigns.py'
      - 'supabase/migrations/050_job_search_campaign_persistence.sql'
      - 'docs/MIGRATION_LEDGER.json'
      - 'tests/test_job_search_campaign*.py'
      - 'tests/test_b19_10_final_integration.py'
      - '.github/workflows/b19-10-campaign-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}
jobs:
  b19-10-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile B19.10 modules
        run: python -m py_compile app/services/job_search_campaign.py app/services/job_search_campaign_progress.py app/services/job_search_campaign_strategy.py app/services/job_search_campaign_action_plan.py app/services/job_search_campaign_dashboard.py app/routes/job_search_campaigns.py
      - name: Run B19.10 regression suite
        env:
          FLASK_ENV: development
        run: python -m pytest -q tests/test_job_search_campaign.py tests/test_job_search_campaign_persistence_contract.py tests/test_job_search_campaign_progress.py tests/test_job_search_campaign_strategy.py tests/test_job_search_campaign_action_plan.py tests/test_b19_10_final_integration.py
      - name: Verify campaign persistence architecture
        run: |
          test -f supabase/migrations/050_job_search_campaign_persistence.sql
          COUNT=$(grep -Ril "create table if not exists public.relocation_job_search_campaigns" supabase/migrations | wc -l)
          test "$COUNT" -eq 1
          python scripts/validate_b16_operations.py
          echo 'B19.10 campaign persistence has one canonical migration and a synchronized ledger'
