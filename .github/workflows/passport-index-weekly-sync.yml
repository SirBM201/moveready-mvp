name: Passport Index Weekly Sync

on:
  schedule:
    # Fridays at 06:17 UTC. The offset avoids the busiest top-of-hour window.
    - cron: "17 6 * * 5"
  workflow_dispatch:
    inputs:
      passport_country:
        description: "Optional single passport country. Leave blank to sync every configured passport."
        required: false
        default: ""

concurrency:
  group: passport-index-weekly-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-passport-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE: ${{ vars.MOVEREADY_API_BASE || 'https://moveready-mvp-production.up.railway.app' }}
      ADMIN_KEY: ${{ secrets.MOVEREADY_ADMIN_KEY }}
      REQUESTED_COUNTRY: ${{ github.event.inputs.passport_country || '' }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY}" ]; then
            echo "MOVEREADY_ADMIN_KEY repository secret is missing."
            exit 1
          fi
          if [ -z "${API_BASE}" ]; then
            echo "MOVEREADY_API_BASE is empty."
            exit 1
          fi

      - name: Wake and verify MoveReady API
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 20 \
            --max-time 180 \
            "${API_BASE%/}/api/build-info" \
            -o build-info.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("build-info.json").read_text())
          if payload.get("ok") is False:
              raise SystemExit(f"MoveReady build-info returned ok=false: {payload}")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Run protected provider sync
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > request.json
          import json
          import os

          country = os.getenv("REQUESTED_COUNTRY", "").strip()
          print(json.dumps({"passport_country": country} if country else {}))
          PY

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 20 \
            --max-time 300 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-MoveReady-Admin-Key: ${ADMIN_KEY}" \
            --data-binary @request.json \
            "${API_BASE%/}/api/visa-power/provider/sync" \
            -o sync-result.json

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("sync-result.json").read_text())
          print(json.dumps(payload, indent=2, sort_keys=True))

          results = payload.get("results") or []
          errors = payload.get("errors") or []
          status = payload.get("status")

          if not payload.get("ok"):
              raise SystemExit(f"Provider sync returned ok=false: {payload}")
          if status not in {"completed", "completed_with_errors"}:
              raise SystemExit(f"Unexpected provider sync status: {status}")
          if errors:
              raise SystemExit(f"Provider sync completed with errors: {errors}")
          if not results:
              raise SystemExit("Provider sync returned no country results.")

          zero_rows = [
              item.get("country")
              for item in results
              if int(item.get("row_count") or item.get("normalized_row_count") or 0) <= 0
          ]
          if zero_rows:
              raise SystemExit(f"Provider sync produced zero rows for: {zero_rows}")

          print(f"Successful passport syncs: {len(results)}")
          PY

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MoveReady Passport Index Weekly Sync"
            echo
            echo "- Schedule: Fridays at 06:17 UTC"
            echo "- API base: ${API_BASE}"
            echo "- Trigger: ${{ github.event_name }}"
            if [ -n "${REQUESTED_COUNTRY}" ]; then
              echo "- Requested passport: ${REQUESTED_COUNTRY}"
            else
              echo "- Requested passports: all configured starter passports"
            fi
            if [ -f sync-result.json ]; then
              echo
              echo '```json'
              cat sync-result.json
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
