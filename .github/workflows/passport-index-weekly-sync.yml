name: Passport Index Weekly Sync

on:
  schedule:
    # Fridays at 06:17 UTC. Launch mode makes one map-provider call for Nigeria.
    - cron: "17 6 * * 5"
  workflow_dispatch:
    inputs:
      passport_country:
        description: "Passport country to sync. Launch default is Nigeria so each run uses one map API call."
        required: false
        default: "Nigeria"

concurrency:
  group: passport-index-weekly-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync-passport-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE: ${{ vars.MOVEREADY_API_BASE || 'https://moveready-mvp-production.up.railway.app' }}
      ADMIN_KEY: ${{ secrets.MOVEREADY_ADMIN_KEY }}
      REQUESTED_COUNTRY: ${{ github.event.inputs.passport_country || 'Nigeria' }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY}" ]; then
            echo "MOVEREADY_ADMIN_KEY repository secret is missing."
            exit 1
          fi
          if [ -z "${API_BASE}" ]; then
            echo "MOVEREADY_API_BASE is empty."
            exit 1
          fi
          if [ -z "${REQUESTED_COUNTRY}" ]; then
            echo "A single passport country is required."
            exit 1
          fi

      - name: Wake and verify MoveReady API
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 20 \
            --max-time 180 \
            "${API_BASE%/}/api/build-info" \
            -o build-info.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("build-info.json").read_text())
          if payload.get("ok") is False:
              raise SystemExit(f"MoveReady build-info returned ok=false: {payload}")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Run protected one-passport provider sync
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' > request.json
          import json
          import os

          country = os.environ["REQUESTED_COUNTRY"].strip()
          print(json.dumps({"passport_country": country}))
          PY

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 20 \
            --max-time 300 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-MoveReady-Admin-Key: ${ADMIN_KEY}" \
            --data-binary @request.json \
            "${API_BASE%/}/api/visa-power/provider/scheduled-sync" \
            -o sync-result.json

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("sync-result.json").read_text())
          print(json.dumps(payload, indent=2, sort_keys=True))

          results = payload.get("results") or []
          errors = payload.get("errors") or []
          status = payload.get("status")

          if not payload.get("ok"):
              raise SystemExit(f"Provider sync returned ok=false: {payload}")
          if status != "scheduled_sync_completed":
              raise SystemExit(f"Unexpected provider sync status: {status}")
          if errors:
              raise SystemExit(f"Provider sync completed with errors: {errors}")
          if len(results) != 1:
              raise SystemExit(f"Expected exactly one passport sync result, received {len(results)}")

          item = results[0]
          row_count = int(item.get("row_count") or item.get("normalized_row_count") or 0)
          if row_count <= 0:
              raise SystemExit(f"Provider sync produced zero rows: {item}")

          print(f"Successful passport sync: {item.get('country')} ({row_count} rows)")
          PY

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MoveReady Passport Index Weekly Sync"
            echo
            echo "- Schedule: Fridays at 06:17 UTC"
            echo "- Cost guardrail: one map-provider call per scheduled run"
            echo "- API base: ${API_BASE}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Requested passport: ${REQUESTED_COUNTRY}"
            if [ -f sync-result.json ]; then
              echo
              echo '```json'
              cat sync-result.json
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "MoveReady Passport Index weekly sync failed";
            const body = [
              "The unattended Passport Index provider sync failed.",
              "",
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Requested passport: ${process.env.REQUESTED_COUNTRY || "Nigeria"}`,
              `- API base: ${process.env.API_BASE}`,
              "",
              "Open the workflow run, review the failed step, confirm the GitHub Actions admin secret, Railway deployment, provider quota, and provider response structure.",
            ].join("\n");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close resolved failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "MoveReady Passport Index weekly sync failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Resolved by successful workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
