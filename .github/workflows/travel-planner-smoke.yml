name: Trip Planner Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "app/routes/travel_planner.py"
      - "app/services/journey_module_patch.py"
      - "app/services/account_session_context.py"
      - "app/__init__.py"
      - ".github/workflows/travel-planner-smoke.yml"
  pull_request:
    paths:
      - "app/routes/travel_planner.py"
      - "app/services/journey_module_patch.py"
      - "app/services/account_session_context.py"
      - "app/__init__.py"
      - ".github/workflows/travel-planner-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLASK_ENV: development
      ENV_MODE: development
      SECRET_KEY: github-actions-trip-smoke-only
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-placeholder
      PASSPORT_INDEX_PROVIDER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: Verify routes and trip module
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          routes = {rule.rule for rule in app.url_map.iter_rules()}
          required = {"/api/travel/options", "/api/travel/trip-plan"}
          missing = required - routes
          assert not missing, missing

          client = app.test_client()
          modules_response = client.get("/api/platform/modules")
          assert modules_response.status_code == 200
          modules = {item["slug"]: item for item in modules_response.get_json()["modules"]}
          assert modules["trip-planner"]["availability"] == "available", modules["trip-planner"]
          assert modules["trip-planner"]["enabled"] is True, modules["trip-planner"]
          print("Trip Planner route and module registration passed.")
          PY
      - name: Test trip readiness without database network
        run: |
          python - <<'PY'
          from app import create_app
          import app.routes.travel_planner as travel

          travel._store_run = lambda payload, result: {**result, "stored": False}
          travel._approved_travel_providers = lambda country, needs: []

          app = create_app()
          client = app.test_client()

          options = client.get("/api/travel/options")
          assert options.status_code == 200, options.get_data(as_text=True)
          assert "flight" in options.get_json()["booking_needs"]

          response = client.post(
              "/api/travel/trip-plan",
              json={
                  "departure_country": "Kuwait",
                  "destination_country": "Mexico",
                  "destination_city": "Mexico City",
                  "passport_country": "Nigeria",
                  "trip_purpose": "tourism",
                  "adults": 1,
                  "children": 0,
                  "infants": 0,
                  "booking_needs": ["flight", "hotel", "travel_insurance"],
                  "passport_valid_months": 4,
                  "destination_entry_rule_checked": False,
                  "visa_or_authorization_confirmed": False,
                  "transit_rule_checked": False,
                  "travel_insurance_confirmed": False,
                  "accommodation_confirmed": False,
                  "onward_or_return_ticket_planned": False,
                  "funds_plan_confirmed": False,
                  "prior_refusal_or_denied_admission": True,
                  "visa_validity_uncertain": True,
                  "trip_budget_amount": 2500,
                  "currency": "USD",
              },
          )
          assert response.status_code == 200, response.get_data(as_text=True)
          payload = response.get_json()
          assert payload["stored"] is False
          assert payload["risk_level"] == "high", payload
          assert payload["readiness_status"] == "not_ready_to_book", payload
          assert len(payload["warnings"]) >= 7, payload
          assert len(payload["booking_sequence"]) == 5, payload
          assert payload["approved_provider_count"] == 0, payload
          assert "commission" in payload["affiliate_disclosure"].lower(), payload
          print("Trip readiness risk, booking, provider, and disclosure checks passed.")
          PY
