name: Jobs Module Integration

on:
  push:
    branches: [main]
    paths:
      - "app/routes/jobs.py"
      - "app/routes/job_automation.py"
      - "app/routes/job_search_scope.py"
      - "app/routes/health.py"
      - "app/routes/account_action_center.py"
      - "app/routes/operations.py"
      - "app/routes/platform_modules.py"
      - "app/core/config.py"
      - "app/services/job_matching.py"
      - "app/services/job_scope.py"
      - "app/services/job_authorization.py"
      - "app/services/job_actions.py"
      - "app/services/job_discovery.py"
      - "app/services/job_documents.py"
      - "app/__init__.py"
      - "supabase/migrations/031_jobs_execution_platform.sql"
      - "supabase/migrations/032_job_discovery_and_application_assistance.sql"
      - "supabase/migrations/034_career_search_scope_and_viability.sql"
      - "supabase/migrations/040_job_official_source_monitoring.sql"
      - "supabase/migrations/041_job_vacancy_reconciliation.sql"
      - "supabase/migrations/042_job_alert_reconciliation.sql"
      - "tests/test_job_matching.py"
      - "tests/test_job_scope.py"
      - "tests/test_job_actions.py"
      - "tests/test_job_automation.py"
      - ".github/workflows/jobs-integration.yml"
      - ".github/workflows/job-monitoring-schedule.yml"
  pull_request:
    paths:
      - "app/routes/jobs.py"
      - "app/routes/job_automation.py"
      - "app/routes/job_search_scope.py"
      - "app/routes/health.py"
      - "app/routes/account_action_center.py"
      - "app/routes/operations.py"
      - "app/routes/platform_modules.py"
      - "app/core/config.py"
      - "app/services/job_matching.py"
      - "app/services/job_scope.py"
      - "app/services/job_authorization.py"
      - "app/services/job_actions.py"
      - "app/services/job_discovery.py"
      - "app/services/job_documents.py"
      - "app/__init__.py"
      - "supabase/migrations/031_jobs_execution_platform.sql"
      - "supabase/migrations/032_job_discovery_and_application_assistance.sql"
      - "supabase/migrations/034_career_search_scope_and_viability.sql"
      - "supabase/migrations/040_job_official_source_monitoring.sql"
      - "supabase/migrations/041_job_vacancy_reconciliation.sql"
      - "supabase/migrations/042_job_alert_reconciliation.sql"
      - "tests/test_job_matching.py"
      - "tests/test_job_scope.py"
      - "tests/test_job_actions.py"
      - "tests/test_job_automation.py"
      - ".github/workflows/jobs-integration.yml"
      - ".github/workflows/job-monitoring-schedule.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app

      - name: Run Jobs matching tests
        run: python -m unittest discover -s tests -p "test_job_*.py" -v

      - name: Verify Jobs route and platform contracts
        env:
          FLASK_ENV: development
          SECRET_KEY: github-actions-jobs-contract-only
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: smoke-test-placeholder
        run: |
          python - <<'PY'
          from app import create_app
          from app.routes import jobs, operations

          app = create_app()
          client = app.test_client()
          routes = {rule.rule for rule in app.url_map.iter_rules()}
          required = {
              "/api/jobs/options",
              "/api/jobs/profile",
              "/api/jobs/profile/search-scope",
              "/api/jobs/profile/bootstrap",
              "/api/jobs/summary",
              "/api/jobs/companies",
              "/api/jobs/recruiters",
              "/api/jobs",
              "/api/jobs/applications",
              "/api/jobs/resume-vault",
              "/api/jobs/automation/overview",
              "/api/jobs/automation/watches/bootstrap",
              "/api/jobs/automation/scan",
              "/api/admin/jobs/automation/scheduled-scan",
          }
          assert required.issubset(routes), sorted(required - routes)
          assert client.get("/api/jobs/options").status_code == 401

          jobs.get_verified_session_email = lambda: "general.user@example.com"
          options = client.get("/api/jobs/options").get_json()
          assert options["ok"] is True, options
          assert options["options"]["search_scopes"] == ["local", "international", "both"], options
          assert "employer_support_confirmed" in options["options"]["work_authorization_requirements"], options

          build = client.get("/api/build-info").get_json()
          assert build["features"]["jobs_workspace"] is True
          assert build["features"]["jobs_official_source_monitoring"] is True
          assert build["features"]["jobs_truthful_document_drafts"] is True
          assert build["features"]["jobs_controlled_application_handoff"] is True
          assert required <= set(build["expected_endpoints"])

          modules = {item["slug"]: item for item in client.get("/api/platform/modules").get_json()["modules"]}
          assert modules["jobs"]["availability"] == "available"
          support = modules["jobs"]["current_support"].lower()
          assert "migrations 031, 032, and 034" in support, support

          schema_codes = {item["code"] for item in operations.SCHEMA_CHECKS}
          assert {
              "job_search_profiles",
              "job_companies",
              "job_recruiters",
              "job_company_targets",
              "jobs",
              "job_resume_assets",
              "job_applications",
              "job_watches",
              "job_scan_runs",
              "job_alerts",
              "job_document_drafts",
              "job_application_assistance",
              "job_assistance_events",
          }.issubset(schema_codes)
          profile_check = next(item for item in operations.SCHEMA_CHECKS if item["code"] == "job_search_profiles")
          jobs_check = next(item for item in operations.SCHEMA_CHECKS if item["code"] == "jobs")
          assert "search_scope" in profile_check["columns"], profile_check
          assert "work_authorized_countries" in profile_check["columns"], profile_check
          assert "work_authorization_requirement" in jobs_check["columns"], jobs_check
          assert "034_career_search_scope_and_viability.sql" in profile_check["migration"], profile_check
          PY

      - name: Verify private schema and storage safeguards
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/031_jobs_execution_platform.sql").read_text(encoding="utf-8").lower()
          tables = [
              "relocation_job_search_profiles",
              "relocation_job_companies",
              "relocation_job_company_targets",
              "relocation_job_recruiters",
              "relocation_jobs",
              "relocation_job_resume_assets",
              "relocation_job_applications",
          ]
          for table in tables:
              assert f"alter table public.{table} enable row level security" in migration, table
              assert f"revoke all privileges on table public.{table} from public, anon, authenticated" in migration, table
              assert f"grant all privileges on table public.{table} to service_role" in migration, table

          assert "'job-resume-vault'" in migration
          assert "'job-resume-vault',\n  false,\n  5242880" in migration
          assert "application/pdf" in migration
          assert migration.count('"founder_tier":1') >= 15

          automation = Path("supabase/migrations/032_job_discovery_and_application_assistance.sql").read_text(encoding="utf-8").lower()
          private_tables = [
              "relocation_job_watches",
              "relocation_job_scan_runs",
              "relocation_job_alerts",
              "relocation_job_document_drafts",
              "relocation_job_application_assistance",
              "relocation_job_assistance_events",
          ]
          for table in private_tables:
              assert f"alter table public.{table} enable row level security" in automation, table
              assert f"revoke all privileges on table public.{table} from public, anon, authenticated" in automation, table
              assert f"grant all privileges on table public.{table} to service_role" in automation, table
          assert "no automatic submission" in automation
          assert "user_confirmations" in automation

          scope = Path("supabase/migrations/034_career_search_scope_and_viability.sql").read_text(encoding="utf-8").lower()
          for column in [
              "search_scope",
              "current_country",
              "work_authorized_countries",
              "work_authorization_requirement",
              "sponsorship_evidence",
              "relocation_support_status",
          ]:
              assert column in scope, column
          assert "('local', 'international', 'both')" in scope

          for filename in [
              "040_job_official_source_monitoring.sql",
              "041_job_vacancy_reconciliation.sql",
              "042_job_alert_reconciliation.sql",
          ]:
              text = Path("supabase/migrations", filename).read_text(encoding="utf-8").lower()
              assert "relocation_job" in text, filename

          vacancy_reconciliation = Path("supabase/migrations/041_job_vacancy_reconciliation.sql").read_text(encoding="utf-8").lower()
          alert_reconciliation = Path("supabase/migrations/042_job_alert_reconciliation.sql").read_text(encoding="utf-8").lower()
          assert "canonical" in vacancy_reconciliation
          assert "archive" in vacancy_reconciliation
          assert "dismiss" in alert_reconciliation
          assert "vacancy" in alert_reconciliation
          PY
