name: SG49 MoveReady full backend verification (temporary)
on:
  push:
    branches: [feat/sg49-product-funnel-telemetry]
    paths:
      - .github/workflows/sg49-moveready-full-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENV_MODE: production
      FLASK_ENV: production
      SECRET_KEY: github-actions-sg49-only
      CORS_ORIGINS: https://example.vercel.app
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-placeholder
      MOVEREADY_ADMIN_API_KEY: smoke-admin-key
      AUTH_OTP_DEV_MODE: "false"
      EMAIL_OTP_DELIVERY_ENABLED: "false"
      SPARKGROWTH_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest
      - name: Compile backend and tests
        run: python -m compileall -q app tests
      - name: Full backend test suite
        run: python -m pytest -q tests
      - name: Reject obvious committed telemetry secrets
        shell: bash
        run: |
          if git grep -nE 'SPARKGROWTH_INGESTION_KEY=sg_[A-Za-z0-9_-]+' -- ':!.env.example'; then
            echo 'SparkGrowth ingestion secret appears committed'
            exit 1
          fi
