name: Mailtrap SMTP OTP Integration

on:
  push:
    branches: [main]
    paths:
      - "app/routes/auth.py"
      - "app/services/email_delivery.py"
      - "app/core/config.py"
      - ".env.example"
      - ".github/workflows/mailtrap-otp-integration.yml"
  pull_request:
    paths:
      - "app/routes/auth.py"
      - "app/services/email_delivery.py"
      - "app/core/config.py"
      - ".env.example"
      - ".github/workflows/mailtrap-otp-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mailtrap-otp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV_MODE: production
      FLASK_ENV: production
      SECRET_KEY: github-actions-mailtrap-otp-only
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-placeholder
      EMAIL_OTP_DELIVERY_ENABLED: "true"
      EMAIL_OTP_PROVIDER: smtp
      EMAIL_OTP_APP_NAME: MoveReady
      EMAIL_OTP_LOGIN_URL: https://example.com/login
      EMAIL_OTP_FROM: MoveReady <login@example.com>
      SMTP_HOST: live.smtp.mailtrap.io
      SMTP_PORT: "587"
      SMTP_USERNAME: api
      SMTP_PASSWORD: smoke-test-placeholder
      SMTP_USE_TLS: "true"
      SMTP_USE_SSL: "false"
      AUTH_OTP_DEV_MODE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile OTP modules
        run: python -m compileall -q app/routes/auth.py app/services/email_delivery.py app/core/config.py

      - name: Verify Mailtrap SMTP readiness contract
        run: |
          python - <<'PY'
          from app.services.email_delivery import email_delivery_status

          status = email_delivery_status()
          assert status['enabled'] is True, status
          assert status['configured'] is True, status
          assert status['provider'] == 'smtp', status
          assert status['missing_configuration'] == [], status
          print('Mailtrap SMTP configuration is recognized as ready without contacting Mailtrap.')
          PY

      - name: Verify OTP route sends, fails closed, and never exposes production codes
        run: |
          python - <<'PY'
          from types import SimpleNamespace

          from app import create_app
          from app.routes import auth


          class FakeQuery:
              def __init__(self, store, action='select'):
                  self.store = store
                  self.action = action
                  self.payload = None

              def select(self, *_args, **_kwargs):
                  self.action = 'select'
                  return self

              def insert(self, payload):
                  self.action = 'insert'
                  self.payload = payload
                  return self

              def update(self, payload):
                  self.action = 'update'
                  self.payload = payload
                  return self

              def eq(self, *_args, **_kwargs):
                  return self

              def gte(self, *_args, **_kwargs):
                  return self

              def order(self, *_args, **_kwargs):
                  return self

              def limit(self, *_args, **_kwargs):
                  return self

              def execute(self):
                  if self.action == 'insert':
                      row = dict(self.payload or {})
                      row['id'] = f"otp-{len(self.store['inserts']) + 1}"
                      self.store['inserts'].append(row)
                      return SimpleNamespace(data=[row])
                  if self.action == 'update':
                      self.store['updates'].append(dict(self.payload or {}))
                      return SimpleNamespace(data=[])
                  return SimpleNamespace(data=[])


          class FakeSupabase:
              def __init__(self, store):
                  self.store = store

              def table(self, _name):
                  return FakeQuery(self.store)


          store = {'inserts': [], 'updates': []}
          auth.get_supabase = lambda: FakeSupabase(store)

          delivery_calls = []

          def sent(to_email, code, expires_minutes):
              delivery_calls.append((to_email, code, expires_minutes))
              return {'ok': True, 'status': 'sent', 'provider': 'smtp'}

          auth.deliver_login_code = sent
          app = create_app()
          client = app.test_client()

          response = client.post('/api/auth/request-code', json={'email': 'owner@example.com', 'source_page': '/login'})
          payload = response.get_json()
          assert response.status_code == 200, (response.status_code, payload)
          assert payload['ok'] is True, payload
          assert payload['delivery_status'] == 'sent', payload
          assert payload['delivery_provider'] == 'smtp', payload
          assert 'dev_code' not in payload, payload
          assert delivery_calls and len(delivery_calls[0][1]) == 6, delivery_calls
          assert store['inserts'] and store['inserts'][0]['code_hash'], store
          assert delivery_calls[0][1] not in str(store['inserts'][0]), store

          def failed(_to_email, _code, _expires_minutes):
              return {'ok': False, 'status': 'smtp_send_failed', 'provider': 'smtp', 'detail': 'simulated failure'}

          auth.deliver_login_code = failed
          failure = client.post('/api/auth/request-code', json={'email': 'second@example.com'})
          failure_payload = failure.get_json()
          assert failure.status_code == 503, (failure.status_code, failure_payload)
          assert failure_payload['error'] == 'otp_delivery_failed', failure_payload
          assert any(item.get('status') == 'expired' for item in store['updates']), store
          assert 'dev_code' not in failure_payload, failure_payload

          malformed = client.post('/api/auth/verify-code', json={'email': 'owner@example.com', 'code': '12AB'})
          assert malformed.status_code == 400, malformed.get_json()
          assert malformed.get_json()['error'] == 'six_digit_code_required'

          assert auth._dev_code_allowed() is False
          print('OTP delivery is invoked, failed delivery invalidates the code, and production responses never expose it.')
          PY
