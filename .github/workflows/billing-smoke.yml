name: Billing and Provider Controls Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "app/routes/billing.py"
      - "app/routes/billing_admin.py"
      - "app/routes/operations.py"
      - "app/routes/admin_review_queue.py"
      - "app/routes/partners.py"
      - "app/services/travel_provider_publication.py"
      - "app/services/account_session_context.py"
      - "app/services/journey_module_patch.py"
      - "app/core/config.py"
      - "app/__init__.py"
      - "supabase/migrations/023_provider_publication_and_commercial_quotes.sql"
      - ".github/workflows/billing-smoke.yml"
  pull_request:
    paths:
      - "app/routes/billing.py"
      - "app/routes/billing_admin.py"
      - "app/routes/operations.py"
      - "app/routes/admin_review_queue.py"
      - "app/routes/partners.py"
      - "app/services/travel_provider_publication.py"
      - "app/services/account_session_context.py"
      - "app/services/journey_module_patch.py"
      - "app/core/config.py"
      - "app/__init__.py"
      - "supabase/migrations/023_provider_publication_and_commercial_quotes.sql"
      - ".github/workflows/billing-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLASK_ENV: development
      ENV_MODE: development
      SECRET_KEY: github-actions-billing-smoke-only
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-placeholder
      COMMERCIAL_QUOTES_ENABLED: "true"
      PAYMENT_LINKS_ENABLED: "false"
      PASSPORT_INDEX_PROVIDER_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app

      - name: Verify billing, operations, and provider routes
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          routes = {rule.rule for rule in app.url_map.iter_rules()}
          required = {
              "/api/operations/status",
              "/api/admin/operations/status",
              "/api/billing/status",
              "/api/billing/catalog",
              "/api/billing/quote-requests",
              "/api/billing/quotes",
              "/api/billing/quotes/<quote_ref>",
              "/api/billing/quotes/<quote_ref>/accept",
              "/api/billing/quotes/<quote_ref>/decline",
              "/api/billing/quotes/<quote_ref>/checkout",
              "/api/admin/commercial-quotes",
              "/api/admin/commercial-quotes/<quote_id>",
              "/api/admin/commercial-quotes/<quote_id>/mark-paid",
              "/api/admin/provider-publication/<provider_id>",
              "/api/partners/approved",
          }
          missing = sorted(required - routes)
          if missing:
              raise SystemExit(f"Missing required routes: {missing}")
          print("Billing, operations, and provider routes registered.")
          PY

      - name: Verify fail-closed public billing and operations status
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          client = app.test_client()

          operations = client.get("/api/operations/status")
          assert operations.status_code == 200, operations.get_data(as_text=True)
          operations_payload = operations.get_json()
          assert operations_payload["ok"] is True, operations_payload
          assert operations_payload["public_capabilities"]["provider_publication"] == "fail_closed_until_schema_and_admin_review_pass", operations_payload
          assert operations_payload["public_capabilities"]["online_checkout"] is False, operations_payload

          status = client.get("/api/billing/status")
          assert status.status_code == 200, status.get_data(as_text=True)
          payload = status.get_json()
          assert payload["commercial_quotes_enabled"] is True, payload
          assert payload["payment_links_enabled"] is False, payload
          assert payload["checkout_mode"] == "disabled_until_payment_setup", payload

          catalog = client.get("/api/billing/catalog")
          assert catalog.status_code == 200, catalog.get_data(as_text=True)
          catalog_payload = catalog.get_json()
          slugs = {item["slug"] for item in catalog_payload["catalog"]}
          assert {"readiness_report", "expert_review", "admission_support", "travel_booking", "legalization", "settlement"}.issubset(slugs), slugs

          modules = client.get("/api/platform/modules")
          assert modules.status_code == 200, modules.get_data(as_text=True)
          module_rows = {item["slug"]: item for item in modules.get_json()["modules"]}
          assert module_rows["billing"]["availability"] == "available", module_rows.get("billing")

          private_quotes = client.get("/api/billing/quotes")
          assert private_quotes.status_code == 401, private_quotes.get_data(as_text=True)

          protected_operations = client.get("/api/admin/operations/status")
          assert protected_operations.status_code == 401, protected_operations.get_data(as_text=True)

          checkout = client.post("/api/billing/quotes/MRQ-TEST/checkout", json={})
          assert checkout.status_code == 401, checkout.get_data(as_text=True)
          print("Billing and operations fail closed without account, admin, migration, or payment setup.")
          PY

      - name: Verify protected operations assessment without network
        run: |
          python - <<'PY'
          from app.routes import operations

          checks = [
              {"code": "profiles", "critical": True, "ok": True, "required_for": "profiles", "migration": "008.sql"},
              {"code": "commercial_quotes", "critical": False, "ok": False, "required_for": "commercial quotes", "migration": "023.sql"},
          ]
          configuration = {
              "supabase_configured": True,
              "admin_key_configured": True,
              "email_otp_delivery_enabled": False,
              "opportunity_alerts_enabled": False,
              "whatsapp_alerts_enabled": False,
              "passport_provider_enabled": False,
              "passport_provider_credentials_present": False,
              "commercial_quotes_enabled": True,
              "payment_links_enabled": False,
          }
          assessment = operations._operational_assessment(checks, configuration)
          assert assessment["overall_status"] == "core_operational_controlled_rollout", assessment
          assert assessment["critical_schema_ready"] is True, assessment
          assert assessment["optional_schema_ready"] is False, assessment
          assert any("commercial quotes" in item for item in assessment["controlled_rollout_items"]), assessment
          print("Operations assessment distinguishes blockers from controlled rollout.")
          PY

      - name: Verify published provider filter helper
        run: |
          python - <<'PY'
          import app.services.travel_provider_publication as publication

          class Result:
              data = [
                  {
                      "id": "provider-1",
                      "provider_type": "travel_booking",
                      "business_name": "Approved Travel Partner",
                      "website_url": "https://example.com",
                      "country": "Kuwait",
                      "city": "Kuwait City",
                      "service_countries": ["Finland"],
                      "service_summary": "Flight and hotel travel booking support",
                      "credentials_summary": "Reviewed credentials",
                      "preferred_contact_channel": "email",
                      "status": "approved",
                      "public_listing_enabled": True,
                      "privacy_reviewed": True,
                      "pricing_reviewed": True,
                      "refund_policy_reviewed": True,
                      "sensitive_document_handling_reviewed": True,
                      "affiliate_relationship": True,
                      "affiliate_disclosure": "MoveReady may earn a disclosed referral commission.",
                      "public_notes": "Independent price checks remain recommended.",
                      "approved_at": "2030-01-01T00:00:00+00:00",
                  },
                  {
                      "id": "provider-2",
                      "provider_type": "travel_booking",
                      "business_name": "Incomplete Provider",
                      "service_countries": ["Finland"],
                      "service_summary": "Flight booking",
                      "status": "approved",
                      "public_listing_enabled": True,
                      "privacy_reviewed": False,
                      "pricing_reviewed": True,
                      "refund_policy_reviewed": True,
                      "sensitive_document_handling_reviewed": True,
                  },
              ]

          class Query:
              def select(self, *_args, **_kwargs): return self
              def eq(self, *_args, **_kwargs): return self
              def limit(self, *_args, **_kwargs): return self
              def execute(self): return Result()

          class Supabase:
              def table(self, _name): return Query()

          publication.get_supabase = lambda: Supabase()
          rows = publication.approved_travel_providers("Finland", ["flight", "hotel"])
          assert len(rows) == 1, rows
          assert rows[0]["business_name"] == "Approved Travel Partner", rows
          assert rows[0]["approval_status"] == "approved_public", rows
          assert rows[0]["affiliate_relationship"] is True, rows
          print("Provider publication helper excludes incomplete records.")
          PY
