name: B18 Source Reliability Regression Gate

on:
  push:
    branches: [main]
    paths:
      - "app/services/job_discovery_hardening.py"
      - "app/services/job_alert_reconciliation.py"
      - "app/services/job_scan_lifecycle.py"
      - "app/services/job_scan_backoff.py"
      - "app/services/job_source_health.py"
      - "app/services/job_automation_profile_patch.py"
      - "app/routes/job_automation.py"
      - "tests/test_job_discovery_hardening.py"
      - "tests/test_job_alert_reconciliation.py"
      - "tests/test_job_scan_lifecycle.py"
      - "tests/test_job_scan_backoff.py"
      - "tests/test_job_source_health.py"
      - ".github/workflows/b18-source-reliability-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/services/job_discovery_hardening.py"
      - "app/services/job_alert_reconciliation.py"
      - "app/services/job_scan_lifecycle.py"
      - "app/services/job_scan_backoff.py"
      - "app/services/job_source_health.py"
      - "app/services/job_automation_profile_patch.py"
      - "app/routes/job_automation.py"
      - "tests/test_job_discovery_hardening.py"
      - "tests/test_job_alert_reconciliation.py"
      - "tests/test_job_scan_lifecycle.py"
      - "tests/test_job_scan_backoff.py"
      - "tests/test_job_source_health.py"
      - ".github/workflows/b18-source-reliability-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b18-source-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENV_MODE: production
      FLASK_ENV: production
      SECRET_KEY: github-actions-b18-only
      CORS_ORIGINS: https://example.vercel.app
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-placeholder
      MOVEREADY_ADMIN_API_KEY: smoke-admin-key
      AUTH_OTP_DEV_MODE: "false"
      EMAIL_OTP_DELIVERY_ENABLED: "false"
      PASSPORT_INDEX_PROVIDER_ENABLED: "false"
      PAYMENT_LINKS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest

      - name: Compile B18 runtime and tests
        run: |
          python -m py_compile \
            app/services/job_discovery_hardening.py \
            app/services/job_alert_reconciliation.py \
            app/services/job_scan_lifecycle.py \
            app/services/job_scan_backoff.py \
            app/services/job_source_health.py \
            app/services/job_automation_profile_patch.py \
            app/routes/job_automation.py
          python -m compileall -q tests

      - name: Run B18 source reliability regression suite
        run: |
          python -m pytest -q \
            tests/test_job_discovery_hardening.py \
            tests/test_job_alert_reconciliation.py \
            tests/test_job_scan_lifecycle.py \
            tests/test_job_scan_backoff.py \
            tests/test_job_source_health.py

      - name: Verify B18 integration contract
        shell: python
        run: |
          from pathlib import Path

          required = {
              "app/services/job_discovery_hardening.py": ["_MAX_TRANSIENT_ATTEMPTS", "recovered_after_retry", "official_source_timeout"],
              "app/services/job_alert_reconciliation.py": ["scan_failed", "source_failed"],
              "app/services/job_scan_lifecycle.py": ["stale_scan_recovered"],
              "app/services/job_scan_backoff.py": ["PERSISTENT_FAILURE_THRESHOLD", "retry_delay_minutes", "persistent_failure"],
              "app/services/job_source_health.py": ["healthy", "degraded", "persistent_failure", "automatic_recovery_verified"],
              "app/services/job_automation_profile_patch.py": ["install_scan_lifecycle", "install_scan_backoff", "install_source_health"],
          }
          missing = []
          for filename, terms in required.items():
              text = Path(filename).read_text(encoding="utf-8")
              for term in terms:
                  if term not in text:
                      missing.append(f"{filename}: {term}")
          if missing:
              raise SystemExit("B18 integration contract missing: " + ", ".join(missing))
          print("B18 integration contract verified.")

      - name: Verify B18 safety boundary
        shell: python
        run: |
          from pathlib import Path
          text = Path("app/services/job_scan_backoff.py").read_text(encoding="utf-8")
          if "is_active\": False" in text or "is_active': False" in text:
              raise SystemExit("B18 must not silently disable employer watches after source failures.")
          print("B18 safety boundary verified: failures back off without silently disabling watches.")
