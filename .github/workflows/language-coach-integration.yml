name: Language Coach Integration

on:
  push:
    branches: [main]
    paths:
      - "app/routes/health.py"
      - "app/routes/language_coach.py"
      - "app/routes/language_coach_extension.py"
      - "app/routes/operations.py"
      - "app/services/language_coach.py"
      - "app/__init__.py"
      - "supabase/migrations/034_language_coach_v1.sql"
      - "supabase/migrations/035_language_coach_starter_bank.sql"
      - "supabase/migrations/039_language_coach_backend_completion.sql"
      - "tests/test_language_coach*.py"
      - "docs/B07_LANGUAGE_COACH_BACKEND.md"
      - ".github/workflows/language-coach-integration.yml"
  pull_request:
    paths:
      - "app/routes/health.py"
      - "app/routes/language_coach.py"
      - "app/routes/language_coach_extension.py"
      - "app/routes/operations.py"
      - "app/services/language_coach.py"
      - "app/__init__.py"
      - "supabase/migrations/034_language_coach_v1.sql"
      - "supabase/migrations/035_language_coach_starter_bank.sql"
      - "supabase/migrations/039_language_coach_backend_completion.sql"
      - "tests/test_language_coach*.py"
      - "docs/B07_LANGUAGE_COACH_BACKEND.md"
      - ".github/workflows/language-coach-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moveready_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Create Supabase database roles
        run: |
          psql --dbname moveready_fresh --set ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL

      - name: Apply migration 039 twice on a fresh database
        run: |
          psql --dbname moveready_fresh --set ON_ERROR_STOP=1 \
            --file supabase/migrations/039_language_coach_backend_completion.sql
          psql --dbname moveready_fresh --set ON_ERROR_STOP=1 \
            --file supabase/migrations/039_language_coach_backend_completion.sql

      - name: Verify fresh-install schema, seed, RLS, and grants
        run: |
          psql --dbname moveready_fresh --set ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            table_name text;
            question_count integer;
          begin
            foreach table_name in array array[
              'relocation_language_profiles',
              'relocation_language_questions',
              'relocation_language_attempts',
              'relocation_language_mistakes',
              'relocation_language_daily_progress'
            ]
            loop
              if to_regclass('public.' || table_name) is null then
                raise exception 'missing table: %', table_name;
              end if;

              if not (
                select relrowsecurity
                from pg_class
                where oid = ('public.' || table_name)::regclass
              ) then
                raise exception 'RLS is not enabled on %', table_name;
              end if;

              if has_table_privilege('anon', 'public.' || table_name, 'select')
                or has_table_privilege('authenticated', 'public.' || table_name, 'select') then
                raise exception 'direct read privilege leaked on %', table_name;
              end if;

              if not has_table_privilege('service_role', 'public.' || table_name, 'select') then
                raise exception 'service_role cannot read %', table_name;
              end if;
            end loop;

            select count(*) into question_count
            from public.relocation_language_questions;
            if question_count <> 16 then
              raise exception 'expected 16 idempotent starter questions, found %', question_count;
            end if;

            if (
              select count(*)
              from pg_constraint
              where conname in (
                'relocation_language_profiles_b07_allocation_chk',
                'relocation_language_questions_b07_choices_chk',
                'relocation_language_questions_b07_provenance_chk',
                'relocation_language_attempts_b07_response_seconds_chk'
              )
            ) <> 4 then
              raise exception 'one or more B07 constraints are missing';
            end if;
          end
          $$;

          do $$
          begin
            begin
              insert into public.relocation_language_questions (
                language, exam, skill, difficulty, prompt, choices,
                correct_answer, explanation, content_origin
              ) values (
                'english', 'IELTS General', 'grammar', 1, 'invalid choices test',
                '{}'::jsonb, 'x', 'x', 'moveready_original'
              );
              raise exception 'invalid JSON choices were accepted';
            exception when check_violation then
              null;
            end;

            begin
              insert into public.relocation_language_questions (
                language, exam, skill, difficulty, prompt, choices,
                correct_answer, explanation, content_origin
              ) values (
                'english', 'IELTS General', 'grammar', 1, 'invalid provenance test',
                '["a","b"]'::jsonb, 'a', 'x', 'official_released'
              );
              raise exception 'official content without HTTPS provenance was accepted';
            exception when check_violation then
              null;
            end;
          end
          $$;
          SQL

      - name: Verify upgrade from migrations 034 and 035
        run: |
          createdb moveready_upgrade
          psql --dbname moveready_upgrade --set ON_ERROR_STOP=1 \
            --file supabase/migrations/034_language_coach_v1.sql
          psql --dbname moveready_upgrade --set ON_ERROR_STOP=1 \
            --file supabase/migrations/035_language_coach_starter_bank.sql
          psql --dbname moveready_upgrade --set ON_ERROR_STOP=1 \
            --file supabase/migrations/039_language_coach_backend_completion.sql
          psql --dbname moveready_upgrade --set ON_ERROR_STOP=1 \
            --file supabase/migrations/039_language_coach_backend_completion.sql
          test "$(psql --dbname moveready_upgrade --tuples-only --no-align \
            --command 'select count(*) from public.relocation_language_questions')" = "16"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app

      - name: Run B07 Language Coach tests
        run: python -m unittest discover -s tests -p "test_language_coach*.py" -v

      - name: Verify B07 route and build contracts
        env:
          FLASK_ENV: development
          SECRET_KEY: github-actions-language-contract-only
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: smoke-test-placeholder
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          client = app.test_client()
          routes = {rule.rule for rule in app.url_map.iter_rules()}
          required = {
              "/api/language-coach/options",
              "/api/language-coach/catalog",
              "/api/language-coach/plan",
              "/api/language-coach/profile",
              "/api/language-coach/diagnostic",
              "/api/language-coach/diagnostic/complete",
              "/api/language-coach/practice",
              "/api/language-coach/adaptive-practice",
              "/api/language-coach/daily-challenge",
              "/api/language-coach/attempts",
              "/api/language-coach/mistakes",
              "/api/language-coach/review",
              "/api/language-coach/progress",
              "/api/language-coach/qualification-actions",
          }
          assert required.issubset(routes), sorted(required - routes)

          options = client.get("/api/language-coach/options")
          assert options.status_code == 200, options.get_data(as_text=True)
          payload = options.get_json()
          assert payload["contract_version"] == "b07-v1", payload
          assert payload["language_choices"] == ["english", "french", "both"], payload
          assert payload["answer_key_policy"] == "withheld_until_answer_recorded", payload

          for path in (
              "/api/language-coach/profile",
              "/api/language-coach/practice",
              "/api/language-coach/diagnostic",
              "/api/language-coach/adaptive-practice",
              "/api/language-coach/daily-challenge",
              "/api/language-coach/mistakes",
              "/api/language-coach/review",
              "/api/language-coach/progress",
          ):
              response = client.get(path)
              assert response.status_code == 401, (path, response.get_data(as_text=True))

          invalid = client.post(
              "/api/language-coach/plan",
              json={
                  "language_selection": "both",
                  "allocation": {"english": 60, "french": 40},
              },
          )
          assert invalid.status_code == 400, invalid.get_data(as_text=True)

          build = client.get("/api/build-info").get_json()
          assert build["features"]["language_coach"] is True, build
          assert required - {"/api/language-coach/catalog", "/api/language-coach/plan"} <= set(build["expected_endpoints"])
          assert build["route_contract"]["ok"] is True, build["route_contract"]
          PY

      - name: Verify B07 schema, privacy, and content safeguards
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path("supabase/migrations/034_language_coach_v1.sql").read_text(encoding="utf-8").lower()
          seed = Path("supabase/migrations/035_language_coach_starter_bank.sql").read_text(encoding="utf-8").lower()
          completion = Path("supabase/migrations/039_language_coach_backend_completion.sql").read_text(encoding="utf-8").lower()

          tables = [
              "relocation_language_profiles",
              "relocation_language_questions",
              "relocation_language_attempts",
              "relocation_language_mistakes",
              "relocation_language_daily_progress",
          ]
          for table in tables:
              assert f"create table if not exists {table}" in schema, table
              assert f"create table if not exists public.{table}" in completion, table
              assert f"alter table public.{table} enable row level security" in completion, table
              assert f"revoke all privileges on table public.{table} from public, anon, authenticated" in completion, table
              assert f"grant all privileges on table public.{table} to service_role" in completion, table

          assert "moveready_original" in seed
          assert "ielts general" in seed
          assert "tef canada" in seed
          assert "recalled/live exam" in seed
          assert "official_released" in completion
          assert "source_url ~ '^https://'" in completion
          assert "response_seconds between 0 and 7200" in completion
          assert "where not exists" in completion
          assert "prerequisite missing" not in completion
          assert "language_learning_profiles" not in completion
          assert "language_practice_items" not in completion
          PY
