name: B19.7 Final Application Lifecycle Regression Gate

on:
  pull_request:
    paths:
      - 'app/services/job_application_lifecycle*.py'
      - 'app/services/job_application_followup*.py'
      - 'app/routes/job_application_lifecycle.py'
      - 'app/routes/job_application_followups.py'
      - 'tests/test_job_application_lifecycle*.py'
      - 'tests/test_job_application_followup*.py'
      - 'tests/test_b19_7_lifecycle_final_integration.py'
      - 'supabase/migrations/048_job_application_lifecycle.sql'
      - 'supabase/migrations/049_job_application_followups.sql'
      - '.github/workflows/b19-7-final-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  b19-7-final-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile B19.7 application lifecycle modules
        run: |
          python -m py_compile \
            app/services/job_application_lifecycle.py \
            app/services/job_application_lifecycle_reconciliation.py \
            app/services/job_application_followup.py \
            app/services/job_application_followup_reconciliation.py \
            app/routes/job_application_lifecycle.py \
            app/routes/job_application_followups.py
      - name: Run complete B19.7 lifecycle regression suite
        env:
          FLASK_ENV: development
        run: |
          python -m pytest -q \
            tests/test_job_application_lifecycle.py \
            tests/test_job_application_lifecycle_api_contract.py \
            tests/test_job_application_lifecycle_reconciliation.py \
            tests/test_job_application_followup.py \
            tests/test_job_application_followup_reconciliation.py \
            tests/test_job_application_followups_api_contract.py \
            tests/test_b19_7_lifecycle_final_integration.py
      - name: Verify B19.7 safety and persistence boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle = Path('app/services/job_application_lifecycle.py').read_text()
          followups = Path('app/services/job_application_followup_reconciliation.py').read_text()
          app_factory = Path('app/__init__.py').read_text()
          migration_48 = Path('supabase/migrations/048_job_application_lifecycle.sql').read_text()
          migration_49 = Path('supabase/migrations/049_job_application_followups.sql').read_text()

          required = {
              'lifecycle safety': ['employer_evidence_required', 'explicit_user_confirmation_required', 'application_lifecycle_is_terminal'],
              'follow-up reconciliation': ['reconcile_due_status', 'reconcile_outcome', 'terminal_followup_updates'],
              'application factory': ['job_application_lifecycle.bp', 'job_application_followups.bp'],
              'lifecycle persistence': ['relocation_job_application_lifecycles', 'relocation_job_application_lifecycle_events'],
              'follow-up persistence': ['relocation_job_application_followups'],
          }
          sources = {
              'lifecycle safety': lifecycle,
              'follow-up reconciliation': followups,
              'application factory': app_factory,
              'lifecycle persistence': migration_48,
              'follow-up persistence': migration_49,
          }
          missing = [f'{group}:{marker}' for group, markers in required.items() for marker in markers if marker not in sources[group]]
          if missing:
              raise SystemExit(f'Missing B19.7 final contract markers: {missing}')
          print('B19.7 final lifecycle integration contract verified')
          PY
