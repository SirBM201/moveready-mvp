name: B13 Dashboard Orchestration

on:
  push:
    branches: [main]
    paths:
      - "app/routes/account_action_center.py"
      - "app/routes/health.py"
      - "tests/test_b13_dashboard_orchestration.py"
      - "tests/test_v1_completion_contract.py"
      - ".github/workflows/b13-dashboard-orchestration.yml"
  pull_request:
    paths:
      - "app/routes/account_action_center.py"
      - "app/routes/health.py"
      - "tests/test_b13_dashboard_orchestration.py"
      - "tests/test_v1_completion_contract.py"
      - ".github/workflows/b13-dashboard-orchestration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLASK_ENV: development
      ENV_MODE: development
      SECRET_KEY: github-actions-b13-only
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-placeholder
      AUTH_OTP_DEV_MODE: "false"
      EMAIL_OTP_DELIVERY_ENABLED: "false"
      PASSPORT_INDEX_PROVIDER_ENABLED: "false"
      PAYMENT_LINKS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m unittest tests.test_b13_dashboard_orchestration tests.test_v1_completion_contract -v
      - name: Verify private route and deployment fingerprint
        run: |
          python - <<'PY'
          from app import create_app

          client = create_app().test_client()
          private = client.get('/api/account/action-center')
          assert private.status_code == 401, private.get_data(as_text=True)
          build = client.get('/api/build-info').get_json()
          assert build['contract_versions']['dashboard_orchestration'] == 'b13-v1', build
          assert 'seven engines' in build['safety_contract']['dashboard_orchestration'].lower(), build
          PY
