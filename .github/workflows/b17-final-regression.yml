name: B17 Final Regression Gate

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/validate_b16_operations.py"
      - "scripts/test-b16-operations-release.ps1"
      - "scripts/test-b17-final-regression.ps1"
      - "docs/MIGRATION_LEDGER.json"
      - "docs/B16_DEPLOYMENT_OPERATIONS.md"
      - "docs/B17_FINAL_REGRESSION.md"
      - "supabase/migrations/**"
      - "sql/**"
      - "requirements.txt"
      - "railway.json"
      - ".env.example"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/validate_b16_operations.py"
      - "scripts/test-b16-operations-release.ps1"
      - "scripts/test-b17-final-regression.ps1"
      - "docs/MIGRATION_LEDGER.json"
      - "docs/B16_DEPLOYMENT_OPERATIONS.md"
      - "docs/B17_FINAL_REGRESSION.md"
      - "supabase/migrations/**"
      - "sql/**"
      - "requirements.txt"
      - "railway.json"
      - ".env.example"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENV_MODE: production
      FLASK_ENV: production
      SECRET_KEY: github-actions-b17-only
      CORS_ORIGINS: https://example.vercel.app
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-placeholder
      MOVEREADY_ADMIN_API_KEY: smoke-admin-key
      AUTH_OTP_DEV_MODE: "false"
      EMAIL_OTP_DELIVERY_ENABLED: "false"
      PASSPORT_INDEX_PROVIDER_ENABLED: "false"
      PAYMENT_LINKS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest

      - name: Validate B16 operations foundation
        run: python scripts/validate_b16_operations.py

      - name: Compile backend and tests
        run: python -m compileall -q app tests scripts/validate_b16_operations.py

      - name: Run B16 runtime contract
        run: python -m pytest -q tests/test_b16_operations_contract.py

      - name: Run Launch V1 completion contract
        run: python -m pytest -q tests/test_v1_completion_contract.py

      - name: Verify B17 release assets
        shell: python
        run: |
          from pathlib import Path

          required = [
              Path("docs/B17_FINAL_REGRESSION.md"),
              Path("scripts/test-b17-final-regression.ps1"),
              Path("docs/MIGRATION_LEDGER.json"),
          ]
          missing = [str(path) for path in required if not path.is_file() or not path.read_text(encoding="utf-8").strip()]
          if missing:
              raise SystemExit(f"Missing or empty B17 release assets: {missing}")

          script = Path("scripts/test-b17-final-regression.ps1").read_text(encoding="utf-8")
          required_terms = [
              "/api/build-info",
              "/api/operations/status",
              "/api/admin/operations/status",
              "MOVEREADY_ADMIN_API_KEY",
              "039_language_coach_backend_completion.sql",
          ]
          absent = [term for term in required_terms if term not in script]
          if absent:
              raise SystemExit(f"B17 production gate is missing required contract checks: {absent}")

          print("B17 release assets verified.")

      - name: Confirm final safety boundary
        shell: python
        run: |
          from pathlib import Path

          script = Path("scripts/test-b17-final-regression.ps1").read_text(encoding="utf-8").lower()
          forbidden = [
              "provider/scheduled-sync",
              "provider/sync",
              "payment-link",
          ]
          found = [term for term in forbidden if term in script]
          if found:
              raise SystemExit(f"B17 release test must remain read-only; forbidden execution targets found: {found}")

          print("B17 safety boundary verified: regression gate remains read-only.")
