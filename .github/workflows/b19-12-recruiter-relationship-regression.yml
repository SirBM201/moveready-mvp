name: B19.12 Recruiter Relationship Regression Gate
on:
  pull_request:
    paths:
      - 'app/services/job_recruiter*.py'
      - 'app/routes/job_recruiter_relationships.py'
      - 'app/__init__.py'
      - 'supabase/migrations/054_job_recruiter_relationships.sql'
      - 'tests/test_job_recruiter_intelligence.py'
      - 'docs/MIGRATION_LEDGER.json'
      - '.github/workflows/b19-12-recruiter-relationship-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}
jobs:
  b19-12-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile B19.12 modules
        run: python -m py_compile app/services/job_recruiter_intelligence.py app/services/job_recruiter_outreach.py app/services/job_recruiter_followups.py app/services/job_recruiter_dashboard.py app/routes/job_recruiter_relationships.py
      - name: Run B19.12 regression suite
        env:
          FLASK_ENV: development
        run: python -m pytest -q tests/test_job_recruiter_intelligence.py
      - name: Verify migration
        run: test -f supabase/migrations/054_job_recruiter_relationships.sql
