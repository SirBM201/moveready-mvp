name: SG49 SparkGrowth telemetry focused verification (temporary)
on:
  push:
    branches: [feat/sg49-product-funnel-telemetry]
    paths:
      - .github/workflows/sg49-sparkgrowth-telemetry-focused.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      ENV_MODE: production
      FLASK_ENV: production
      SECRET_KEY: github-actions-sg49-only
      CORS_ORIGINS: https://example.vercel.app
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-placeholder
      MOVEREADY_ADMIN_API_KEY: smoke-admin-key
      AUTH_OTP_DEV_MODE: "false"
      EMAIL_OTP_DELIVERY_ENABLED: "false"
      SPARKGROWTH_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest
      - name: Compile changed runtime
        run: python -m compileall -q app tests/test_sg49_sparkgrowth_telemetry.py
      - name: Focused telemetry tests
        run: python -m pytest -q tests/test_sg49_sparkgrowth_telemetry.py tests/test_job_scope.py
