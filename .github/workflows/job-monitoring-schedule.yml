name: MoveReady Official Job Monitoring

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: moveready-official-job-monitoring
  cancel-in-progress: false

jobs:
  scan-due-watches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: ${{ vars.MOVEREADY_API_BASE || 'https://moveready-mvp-production.up.railway.app' }}
      ADMIN_KEY: ${{ secrets.MOVEREADY_ADMIN_KEY }}
    steps:
      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY}" ]; then
            echo "MOVEREADY_ADMIN_KEY repository secret is missing."
            exit 1
          fi
          if [ -z "${API_BASE}" ]; then
            echo "MOVEREADY_API_BASE is empty."
            exit 1
          fi

      - name: Wake and verify B16 Railway contract
        shell: bash
        run: |
          set -euo pipefail
          base="${API_BASE%/}"
          for attempt in 1 2 3 4 5; do
            code="$(curl --silent --show-error --location --output /tmp/build-info.json --write-out '%{http_code}' --max-time 45 "${base}/api/build-info" || true)"
            if [ "${code}" = "200" ]; then
              python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/build-info.json').read_text(encoding='utf-8'))
          assert payload.get('contract_versions', {}).get('operations') == 'b16-v1', payload
          assert payload.get('route_contract', {}).get('ok') is True, payload
          assert payload.get('operations_contract', {}).get('admin_boundary', {}).get('ok') is True, payload
          print('B16 Railway deployment contract verified.')
          PY
              exit 0
            fi
            echo "Wake attempt ${attempt} returned HTTP ${code:-network_error}."
            sleep $((attempt * 8))
          done
          echo "Railway backend did not become ready."
          exit 1

      - name: Scan due official employer watches
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          base="${API_BASE%/}"
          code="$(curl --silent --show-error --location \
            --output /tmp/job-scan.json \
            --write-out '%{http_code}' \
            --max-time 180 \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "X-MoveReady-Admin-Key: ${ADMIN_KEY}" \
            --data '{}' \
            "${base}/api/admin/jobs/automation/scheduled-scan" || true)"

          cat /tmp/job-scan.json || true
          echo "http_code=${code}" >> "${GITHUB_OUTPUT}"

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/job-scan.json').read_text(encoding='utf-8'))
          if payload.get('ok') is not True or payload.get('status') != 'completed':
              raise SystemExit(f'Job monitoring scan did not complete safely: {payload}')
          print(
              'Official job monitoring completed:',
              'due=', payload.get('due_watch_count', 0),
              'successful=', payload.get('successful_count', 0),
          )
          PY

          if [ "${code}" != "200" ]; then
            echo "Unexpected HTTP status ${code}."
            exit 1
          fi

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MoveReady official job monitoring"
            echo
            echo "- Schedule: daily at 05:17 UTC"
            echo "- Endpoint: /api/admin/jobs/automation/scheduled-scan"
            echo "- HTTP status: ${{ steps.scan.outputs.http_code || 'not reached' }}"
            echo "- Boundary: official employer and supported public ATS sources; no automatic application submission"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Close previous failure issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'MoveReady official job monitoring failed';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issue = issues.find(item => !item.pull_request && item.title === title);
            if (issue) {
              const body = `Recovered in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'MoveReady official job monitoring failed';
            const body = [
              'The scheduled official job monitoring scan failed.',
              '',
              `Workflow: ${context.workflow}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Check Railway availability, the B16 build contract, MOVEREADY_ADMIN_KEY, migration 032, and the protected job-monitoring endpoint.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issue = issues.find(item => !item.pull_request && item.title === title);
            if (issue) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
