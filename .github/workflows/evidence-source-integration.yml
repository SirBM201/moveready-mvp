name: Evidence and Source Governance Integration

on:
  push:
    branches: [main]
    paths:
      - "app/__init__.py"
      - "app/routes/account.py"
      - "app/routes/admin_review_queue.py"
      - "app/routes/evidence_admin.py"
      - "app/routes/evidence_workflow.py"
      - "app/routes/health.py"
      - "app/routes/platform_modules.py"
      - "app/routes/source_governance.py"
      - "app/routes/operations.py"
      - "supabase/migrations/027_evidence_inventory_and_packs.sql"
      - ".github/workflows/source-governance-weekly.yml"
      - ".github/workflows/evidence-source-integration.yml"
  pull_request:
    paths:
      - "app/__init__.py"
      - "app/routes/account.py"
      - "app/routes/admin_review_queue.py"
      - "app/routes/evidence_admin.py"
      - "app/routes/evidence_workflow.py"
      - "app/routes/health.py"
      - "app/routes/platform_modules.py"
      - "app/routes/source_governance.py"
      - "app/routes/operations.py"
      - "supabase/migrations/027_evidence_inventory_and_packs.sql"
      - ".github/workflows/source-governance-weekly.yml"
      - ".github/workflows/evidence-source-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLASK_ENV: development
      ENV_MODE: development
      SECRET_KEY: github-actions-evidence-source-only
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: smoke-test-placeholder
      MOVEREADY_ADMIN_API_KEY: smoke-admin-key
      AUTH_OTP_DEV_MODE: "false"
      EMAIL_OTP_DELIVERY_ENABLED: "false"
      PASSPORT_INDEX_PROVIDER_ENABLED: "false"
      PAYMENT_LINKS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app

      - name: Verify evidence and source governance routes
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          routes = {rule.rule for rule in app.url_map.iter_rules()}
          required = {
              "/api/evidence/options",
              "/api/evidence/documents",
              "/api/evidence/documents/<document_id>",
              "/api/evidence/packs",
              "/api/evidence/packs/generate",
              "/api/evidence/refusal-repair",
              "/api/source-health/summary",
              "/api/admin/evidence-packs",
              "/api/admin/evidence-packs/<pack_id>",
              "/api/admin/document-inventory/expiring",
              "/api/admin/source-governance/queue",
              "/api/admin/source-governance/scan-due",
              "/api/admin/source-governance/sources/<source_id>/mark-checked",
              "/api/admin/operations/status",
          }
          missing = sorted(required - routes)
          if missing:
              raise SystemExit(f"Missing evidence or source-governance routes: {missing}")
          print("Evidence, refusal-repair, source-health, evidence-admin, and source-governance routes registered.")
          PY

      - name: Verify private routes fail closed
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          client = app.test_client()

          options = client.get('/api/evidence/options')
          assert options.status_code == 200, options.get_data(as_text=True)
          payload = options.get_json()
          assert payload['ok'] is True, payload
          assert 'passport' in payload['document_types'], payload
          assert 'misrepresentation_concern' in {item['key'] for item in payload['refusal_reason_options']}, payload
          assert 'raw' in payload['storage_boundary'].lower(), payload

          for method, path in [
              ('get', '/api/evidence/documents'),
              ('post', '/api/evidence/documents'),
              ('get', '/api/evidence/packs'),
              ('post', '/api/evidence/packs/generate'),
              ('post', '/api/evidence/refusal-repair'),
          ]:
              response = getattr(client, method)(path, json={} if method == 'post' else None)
              assert response.status_code == 401, (path, response.status_code, response.get_data(as_text=True))

          for method, path in [
              ('get', '/api/admin/evidence-packs'),
              ('get', '/api/admin/document-inventory/expiring'),
              ('get', '/api/admin/source-governance/queue'),
              ('post', '/api/admin/source-governance/scan-due'),
          ]:
              response = getattr(client, method)(path, json={} if method == 'post' else None)
              assert response.status_code == 401, (path, response.status_code, response.get_data(as_text=True))

          print('Evidence records, evidence review, and source governance fail closed without verified account or admin access.')
          PY

      - name: Verify metadata-only and refusal safety helpers
        run: |
          python - <<'PY'
          from datetime import date, timedelta

          from app.routes import evidence_workflow

          forbidden = evidence_workflow._forbidden_fields({
              'document_label': 'Passport',
              'passport_number': 'DO-NOT-STORE',
              'file_content': 'raw-bytes',
          })
          assert forbidden == ['file_content', 'passport_number'], forbidden

          for field in [
              'file', 'file_content', 'file_url', 'document_number', 'passport_number',
              'national_id_number', 'bank_account_number', 'card_number', 'otp',
              'password', 'private_key',
          ]:
              assert field in evidence_workflow._forbidden_fields({field: 'test'}), field

          expired = evidence_workflow._derived_document_status({
              'status': 'ready',
              'expiry_date': (date.today() - timedelta(days=1)).isoformat(),
          })
          assert expired == 'expired', expired

          renewal = evidence_workflow._derived_document_status({
              'status': 'ready',
              'expiry_date': (date.today() + timedelta(days=90)).isoformat(),
          })
          assert renewal == 'renewal_needed', renewal

          assert evidence_workflow.REASON_LIBRARY['misrepresentation_concern']['points'] >= 50
          assert 'denied_admission' in evidence_workflow.EVENT_TYPES
          assert 'cancelled' in evidence_workflow.VISA_STATUSES
          assert 'passport_number' in evidence_workflow.FORBIDDEN_SENSITIVE_FIELDS
          print('Metadata-only storage, expiry recalculation, and refusal safety controls verified.')
          PY

      - name: Verify public source health fails closed
        run: |
          python - <<'PY'
          from app import create_app
          from app.routes import source_governance

          def unavailable(*_args, **_kwargs):
              raise RuntimeError('database unavailable')

          source_governance._load_sources = unavailable
          app = create_app()
          client = app.test_client()
          response = client.get('/api/source-health/summary')
          assert response.status_code == 200, response.get_data(as_text=True)
          payload = response.get_json()
          assert payload['ok'] is True, payload
          assert payload['status'] == 'source_health_temporarily_unavailable', payload
          assert payload['sample_health'] == [], payload
          assert 'fail closed' in payload['public_note'].lower(), payload
          print('Source health reports unavailability without inventing current-source claims.')
          PY

      - name: Verify migration 027 remains private
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/027_evidence_inventory_and_packs.sql').read_text(encoding='utf-8').lower()
          for table in [
              'relocation_user_document_inventory',
              'relocation_evidence_packs',
          ]:
              assert f'alter table public.{table} enable row level security' in migration, table
              assert f'revoke all privileges on table public.{table} from public, anon, authenticated' in migration, table
              assert f'grant all privileges on table public.{table} to service_role' in migration, table
          assert 'raw-document storage' in migration
          assert 'full document number' in migration
          assert 'file_content' not in migration
          print('Evidence inventory and packs remain backend-only and metadata-only.')
          PY

      - name: Verify Account Center includes evidence sections
        run: |
          python - <<'PY'
          from pathlib import Path

          account = Path('app/routes/account.py').read_text(encoding='utf-8')
          assert 'relocation_user_document_inventory' in account
          assert 'relocation_evidence_packs' in account
          assert '"evidence_documents": evidence_documents' in account
          assert '"evidence_packs": evidence_packs' in account
          print('Verified Account Center exposes private evidence inventory and pack counts.')
          PY

      - name: Verify platform catalogue reflects implemented tools
        run: |
          python - <<'PY'
          from app.routes.platform_modules import PLATFORM_MODULES

          modules = {item['slug']: item for item in PLATFORM_MODULES}
          for slug in ['source-health', 'evidence', 'study-planner', 'journey-planner', 'trip-planner', 'legalization', 'appointments', 'family-relocation', 'settlement', 'billing']:
              assert modules[slug]['availability'] == 'available', (slug, modules[slug])
          for slug in ['courier', 'partners']:
              assert modules[slug]['availability'] == 'partner_approval_pending', (slug, modules[slug])
          print('Platform catalogue distinguishes implemented self-service tools from provider-dependent execution.')
          PY

      - name: Verify weekly source scan contract
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/source-governance-weekly.yml').read_text(encoding='utf-8')
          assert '47 6 * * 1' in workflow
          assert '/api/admin/source-governance/scan-due' in workflow
          assert 'MOVEREADY_ADMIN_KEY' in workflow
          assert 'create review-due alerts without changing route facts automatically' in workflow
          print('Weekly source-governance scan is protected and non-mutating for route facts.')
          PY
